<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>صوري</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="صوري"><meta name="theme-color" content="#6366f1">
<style>
:root{--bg:#f3f5fb;--card:#fff;--card2:#eaeef9;--ac:#4f6bff;--tx:#1b2240;--mu:#7a85a3}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"SF Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 20px 20px;font-size:23px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4f8cff,#8b5cf6 60%,#ec4899);position:sticky;top:0;z-index:5;border-radius:0 0 26px 26px;box-shadow:0 8px 24px #6366f155}
.c{padding:16px}
button{background:linear-gradient(135deg,#4f8cff,#7c5cff);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:600;margin:4px;font-family:inherit;box-shadow:0 4px 12px #4f6bff33}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button.g{background:#e7ebf6;color:var(--ac);box-shadow:none}
.bar{display:flex;flex-wrap:wrap;margin-bottom:6px}
.f{background:var(--card);border-radius:20px;padding:14px;margin:10px 0;display:flex;align-items:center;gap:12px;font-size:17px;box-shadow:0 4px 16px #1b224012}
.ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
.nm{flex:1;font-weight:600}
.f b{background:var(--card2);color:var(--tx);border-radius:20px;padding:5px 15px;font-size:15px}
.f button.dl{background:#fee2e2;box-shadow:none;margin:0;padding:8px 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.grid div{aspect-ratio:1}
.grid img{width:100%;height:100%;object-fit:cover;border-radius:14px;box-shadow:0 2px 8px #1b224020}
.grid .s{outline:4px solid var(--ac);border-radius:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#ffffffee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #e3e8f4}
nav button{flex:1;background:none;border-radius:0;margin:0;padding:12px 0;font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:2px;align-items:center;box-shadow:none}
nav button span{font-size:22px}
nav button.on{color:var(--ac);font-weight:700}
input,select{width:100%;box-sizing:border-box;padding:14px;font-size:16px;border-radius:14px;border:1px solid #dde3f1;margin:5px 0;background:#fff;color:var(--tx);font-family:inherit}
progress{width:100%;height:10px;border-radius:8px}
h3{color:var(--mu);font-weight:600}
</style></head><body>
<header id="h">صوري</header><div class="c" id="v"></div>
<nav id="nv"><button onclick="home()"><span>📁</span>الفولدرات</button><button onclick="add()"><span>➕</span>إضافة</button><button onclick="ppl()"><span>👤</span>أشخاص</button><button onclick="sort()"><span>⚙️</span>تصنيف</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#3b82f6');g.addColorStop(1,'#7c3aed');x.fillStyle=g;x.fillRect(0,0,180,180);x.font='96px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('📷',90,96);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.append(l)})();
const $=id=>document.getElementById(id),V=$('v'),H=t=>$('h').textContent=t;
let db,cur,sel=false,S=new Set(),busy=false,cur_t='',ed=false;
const TH=.45;
const open_=()=>new Promise(r=>{const q=indexedDB.open('photos1',1);q.onupgradeneeded=()=>{q.result.createObjectStore('p',{keyPath:'id',autoIncrement:true});q.result.createObjectStore('u',{keyPath:'id',autoIncrement:true})};q.onsuccess=()=>{db=q.result;r()}});
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,x)=>tx(s,'readwrite',o=>o.put(x)),get=(s,k)=>tx(s,'readonly',o=>o.get(k));
async function cv(blob,max){const b=await createImageBitmap(blob);const k=Math.min(1,max/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);b.close&&b.close();return c}
const pg=(i,n,t)=>{if($('pr')){$('pr').max=n;$('pr').value=i}if($('st'))$('st').textContent=t};
let ml;const M='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
function models(){if(!ml)ml=Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(M),faceapi.nets.faceLandmark68Net.loadFromUri(M),faceapi.nets.faceRecognitionNet.loadFromUri(M)]);return ml}
async function faces(blob){const c=await cv(blob,1600);const d=await faceapi.detectAllFaces(c,new faceapi.TinyFaceDetectorOptions({inputSize:704,scoreThreshold:.3})).withFaceLandmarks().withFaceDescriptors();return d.filter(x=>x.detection.box.width>=36).map(x=>Array.from(x.descriptor))}
const dist=(a,b)=>{let s=0;for(let i=0;i<128;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)};
async function classify(){const P=await all('u'),A=await all('p');for(const p of A){if(p.folder!='new'&&p.folder!='review')continue;let f;
if(p.faces.length){const sc=u=>Math.min(...p.faces.flatMap(d=>u.desc.map(e=>dist(d,e))));const m=P.map(u=>[u,sc(u)]).filter(x=>x[1]<TH).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);f=m.length?(m.some(u=>u.priv)?'private':'person:'+m[0].id):'review'}else f='unsorted';
if(f!=p.folder){p.folder=f;await put('p',p)}}}
async function redo(){if(!confirm('هعيد توزيع صور الأشخاص. صور المنتجات والفواتير والخاص مش هتتحرك. تكمل؟'))return;const A=await all('p');let n=0;for(const p of A){if(p.folder.startsWith('person:')){p.folder='new';await put('p',p);n++}}await classify();alert('تم، اتعاد توزيع '+n+' صورة')}
async function addFiles(fs){pg(0,fs.length,'بحمل برنامج الوجوه...');await models();
const ex=new Set((await all('p')).map(p=>p.thumb));let ad=0,sk=0;
for(let i=0;i<fs.length;i++){const f=fs[i];try{const t=(await cv(f,240)).toDataURL('image/jpeg',.7);
if(ex.has(t)){sk++}else{ex.add(t);const d=await faces(f);
await put('p',{name:f.name,blob:f,thumb:t,faces:d,folder:'new',text:''});ad++}}catch(e){}
pg(i+1,fs.length,(i+1)+' / '+fs.length)}
