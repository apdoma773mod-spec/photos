<header id="h">صوري</header><div class="c" id="v">جاري التحميل...</div>

<script>
(function(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#3b82f6');g.addColorStop(1,'#7c3aed');x.fillStyle=g;x.fillRect(0,0,180,180);x.font='96px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('📷',90,96);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.append(l)})();
const $=id=>document.getElementById(id),V=$('v'),H=t=>$('h').textContent=t,EM=e=>e?((e.name?e.name+': ':'')+(e.message||'')||String(e)):'خطأ غير معروف';
let db,cur,sel=false,S=new Set(),busy=false,cur_t='',ed=false;
const TH=.45;
const open_=()=>new Promise((r,j)=>{const q=indexedDB.open('photos1',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('p'))d.createObjectStore('p',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('u'))d.createObjectStore('u',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('b'))d.createObjectStore('b',{keyPath:'id'})};q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>j(q.error||new Error('فشل فتح التخزين'));q.onblocked=()=>j(new Error('التخزين متعلق'));setTimeout(()=>j(new Error('التخزين مردّش بعد ٨ ثواني')),8000)});
const tx=(s,m,f)=>new Promise((res,rej)=>{try{const t=db.transaction(s,m),q=f(t.objectStore(s));let er=null;q.onerror=()=>{er=q.error};t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(er||t.error||new Error('فشل غير معروف في التخزين'))}catch(e){rej(e)}});
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,x)=>tx(s,'readwrite',o=>o.put(x)),get=(s,k)=>tx(s,'readonly',o=>o.get(k));
async function blobOf(id){const b=await get('b',id);if(b&&b.buf)return new Blob([b.buf],{type:b.type||'image/jpeg'});const p=await get('p',id);return p&&p.blob}
async function delp(id){await tx('p','readwrite',o=>o.delete(id));await tx('b','readwrite',o=>o.delete(id))}
async function mig(){const ids=await tx('p','readonly',o=>o.getAllKeys());let bad=0,fe=null,n=0;
for(let i=0;i<ids.length;i++){try{const p=await get('p',ids[i]);if(!p||!p.blob)continue;V.textContent='بجهز التخزين (مرة واحدة بس)... '+(i+1)+' / '+ids.length;
const buf=await p.blob.arrayBuffer(),type=p.blob.type||'image/jpeg';await put('b',{id:p.id,buf:buf,type:type});delete p.blob;await put('p',p);n++}catch(e){bad++;fe=fe||e}}
if(bad)showErr('فشل نقل '+bad+' صورة: '+EM(fe))}
async function cv(blob,max){const b=await createImageBitmap(blob);const k=Math.min(1,max/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);b.close&&b.close();return c}
const pg=(i,n,t)=>{if($('pr')){$('pr').max=n;$('pr').value=i}if($('st'))$('st').textContent=t};
let ml;const M='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
function models(){if(!ml)ml=Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(M),faceapi.nets.faceLandmark68Net.loadFromUri(M),faceapi.nets.faceRecognitionNet.loadFromUri(M)]);return ml}
const ls=src=>new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=()=>j(new Error('فشل تحميل: '+src));document.head.append(s)});
let mnp=null;
function mnet(){if(!mnp)mnp=(async()=>{if(!window.tf)await ls('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');if(!window.mobilenet)await ls('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');return await mobilenet.load({version:1,alpha:1.0})})().catch(e=>{mnp=null;throw e});return mnp}
async function emb(blob){const c=await cv(blob,256),m=await mnet(),t=m.infer(c,true),d=await t.data();t.dispose();let n=0;for(const v of d)n+=v*v;n=Math.sqrt(n)||1;return Array.from(d,v=>+(v/n).toFixed(4))}
const dot=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s};
const fname=k=>k=='invoice'?'الفواتير':k.replace('prod:','');
async function auto(){if(busy)return;busy=true;try{const T=.75,MG=.03;pg(0,1,'بحمل برنامج الصور (أول مرة بياخد وقت)...');await mnet();
const A=await all('p');
const ex=A.filter(p=>(p.folder=='invoice'||p.folder.startsWith('prod:'))&&!p.auto);
const cand=A.filter(p=>p.folder=='unsorted'&&!(p.faces&&p.faces.length));
const need=[...ex,...cand].filter(p=>!p.emb);let bad=0,fe=null;
for(let i=0;i<need.length;i++){const p=need[i];try{p.emb=await emb(await blobOf(p.id));await put('p',p)}catch(e){bad++;fe=fe||e}pg(i+1,need.length,'قراءة شكل الصور '+(i+1)+' / '+need.length+(bad?' — فشل '+bad:''))}
const cls={};ex.forEach(p=>{if(p.emb)(cls[p.folder]=cls[p.folder]||[]).push(p.emb)});
const names=Object.keys(cls).filter(k=>cls[k].length>=2),skipped=Object.keys(cls).filter(k=>cls[k].length<2);
if(!names.length){pg(1,1,'مفيش فولدر فيه صورتين أمثلة على الأقل. حط صور في الفولدرات الأول.');busy=false;return}
let moved={},left=0,top=0;
for(const p of cand){if(!p.emb){left++;continue}
const sc=names.map(k=>{const s=cls[k].map(e=>dot(p.emb,e)).sort((a,b)=>b-a),n=Math.min(3,s.length);return[k,s.slice(0,n).reduce((a,b)=>a+b,0)/n]}).sort((a,b)=>b[1]-a[1]);
const best=sc[0],sec=sc[1]?sc[1][1]:0;
if(best[1]>=T&&(names.length<2||best[1]-sec>=MG)){p.folder=best[0];p.auto=best[0];await put('p',p);moved[best[0]]=(moved[best[0]]||0)+1}else{left++;top=Math.max(top,best[1])}}
const tot=Object.values(moved).reduce((a,b)=>a+b,0);
const lines=Object.keys(moved).map(k=>fname(k)+': '+moved[k]).join(' | ');
pg(1,1,'خلصنا ✅ اتصنف '+tot+' صورة'+(lines?' ('+lines+')':'')+' — فضل '+left+' في غير مقسمة (أعلى تشابه فيهم '+top.toFixed(2)+')'+(skipped.length?' — فولدرات أمثلتها قليلة اتخطت: '+skipped.map(fname).join('، '):'')+(bad?' — فشل قراءة '+bad+': '+EM(fe):''))}catch(e){alert('حصل خطأ: '+EM(e))}busy=false}
async function undoAuto(){if(!confirm('أرجّع كل اللي اتصنف تلقائي لـ "غير مقسمة"؟'))return;const A=await all('p');let n=0;for(const p of A){if(p.auto){if(p.folder==p.auto){p.folder='unsorted';n++}delete p.auto;await put('p',p)}}alert('اترجع '+n+' صورة')}
function clo(cvs,b){const W=cvs.width,Hh=cvs.height,x0=Math.max(0,Math.round(b.x-.3*b.width)),x1=Math.min(W,Math.round(b.x+1.3*b.width)),y0=Math.max(0,Math.round(b.y+b.height*1.15)),y1=Math.min(Hh,Math.round(b.y+b.height*2.55));
if(x1-x0<10||y1-y0<10)return null;const d=cvs.getContext('2d').getImageData(x0,y0,x1-x0,y1-y0).data,h=new Array(28).fill(0);let n=0;
for(let i=0;i<d.length;i+=16){const r=d[i]/255,g=d[i+1]/255,bl=d[i+2]/255,mx=Math.max(r,g,bl),mn=Math.min(r,g,bl),df=mx-mn,s=mx?df/mx:0;let k;
if(s<.2)k=Math.min(3,Math.floor(mx*4));else{const hu=df==0?0:mx==r?((g-bl)/df+6)%6:mx==g?(bl-r)/df+2:(r-g)/df+4;k=4+(Math.floor(hu*2)%12)*2+(mx<.5?0:1)}
h[k]++;n++}return n?h.map(v=>+(v/n).toFixed(4)):null}
async function faces(blob){const c=await cv(blob,1600);const d=(await faceapi.detectAllFaces(c,new faceapi.TinyFaceDetectorOptions({inputSize:704,scoreThreshold:.3})).withFaceLandmarks().withFaceDescriptors()).filter(x=>x.detection.box.width>=26);return{faces:d.map(x=>Array.from(x.descriptor)),cl:d.map(x=>clo(c,x.detection.box))}}
const dist=(a,b)=>{let s=0;for(let i=0;i<128;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)};
function csim(a,b){if(!a||!b)return 0;let s=0;for(let i=0;i<a.length;i++)s+=Math.min(a[i],b[i]);return s}
function score(u,p){let best=Infinity;p.faces.forEach((f,i)=>{const c=p.cl&&p.cl[i];u.desc.forEach((e,j)=>{const d=dist(f,e);if(d<TH)best=Math.min(best,d);else if(d<.58&&c&&u.cl&&csim(c,u.cl[j])>=.7)best=Math.min(best,d+.05)})});return best}
const fixCl=u=>{u.cl=u.desc.map((_,i)=>(u.cl||[])[i]||null)};
function rmFace(u,fs){fixCl(u);const k=u.desc.map((e,i)=>fs.some(f=>dist(f,e)<.05)?-1:i).filter(i=>i>=0);u.desc=k.map(i=>u.desc[i]);u.cl=k.map(i=>u.cl[i])}
function addFace(u,f,c){fixCl(u);u.desc.push(f);u.cl.push(c||null)}
async function classify(){const P=await all('u'),A=await all('p');for(const p of A){if(p.folder!='new'&&p.folder!='review')continue;let f;
if(p.faces.length){const m=P.map(u=>[u,score(u,p)]).filter(x=>x[1]<Infinity).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);f=m.length?(m.some(u=>u.priv)?'private':'person:'+m[0].id):'review'}else f='unsorted';
if(f!=p.folder){p.folder=f;await put('p',p)}}}
async function redo(){if(!confirm('هعيد توزيع صور الأشخاص. صور المنتجات والفواتير والخاص مش هتتحرك. تكمل؟'))return;const A=await all('p');let n=0;for(const p of A){if(p.folder.startsWith('person:')){p.folder='new';await put('p',p);n++}}await classify();alert('تم، اتعاد توزيع '+n+' صورة')}
async function smart(){if(busy)return;busy=true;let bad=0,fe=null;try{pg(0,1,'بحمل برنامج الوجوه...');await models();
const A=(await all('p')).filter(p=>!p.cl&&(['new','review','unsorted'].includes(p.folder)||p.folder.startsWith('person:')));
for(let i=0;i<A.length;i++){const p=A[i];try{const r=await faces(await blobOf(p.id));p.faces=r.faces;p.cl=r.cl;await put('p',p)}catch(e){bad++;fe=fe||e}pg(i+1,A.length,'قراءة '+(i+1)+' / '+A.length+(bad?' — فشل '+bad:''))}
const P=await all('u'),B=await all('p');
for(const u of P){const ps=B.filter(p=>p.folder=='person:'+u.id&&p.faces.length==1&&p.cl);if(ps.length){u.desc=ps.map(p=>p.faces[0]);u.cl=ps.map(p=>p.cl[0]);await put('u',u)}}
for(const p of B){if(p.folder=='review'||p.folder=='unsorted'){p.folder='new';await put('p',p)}}
await classify();pg(1,1,'خلصنا ✅ راجع الفولدرات'+(bad?' — فشل حفظ '+bad+' صورة، السبب: '+EM(fe):''));if(bad)alert('فشل حفظ '+bad+' صورة. السبب الحقيقي: '+EM(fe))}catch(e){alert('حصل خطأ: '+EM(e)+(fe?' | أول فشل: '+EM(fe):''))}busy=false}
async function addFiles(fs){pg(0,fs.length,'بحمل برنامج الوجوه...');await models();
const ex=new Set((await all('p')).map(p=>p.thumb));let ad=0,sk=0,bad=0,fe=null;
for(let i=0;i<fs.length;i++){const f=fs[i];try{const t=(await cv(f,240)).toDataURL('image/jpeg',.7);
if(ex.has(t)){sk++}else{ex.add(t);const r=await faces(f);const buf=await f.arrayBuffer();
const id=await put('p',{name:f.name,thumb:t,faces:r.faces,cl:r.cl,folder:'new',text:''});
try{await put('b',{id:id,buf:buf,type:f.type||'image/jpeg'})}catch(e2){await tx('p','readwrite',o=>o.delete(id));throw e2}
ad++}}catch(e){bad++;fe=fe||e}
pg(i+1,fs.length,(i+1)+' / '+fs.length)}
await classify();pg(fs.length,fs.length,'خلصنا ✅ اتضاف '+ad+' — اتخطى '+sk+' مكرر'+(bad?' — فشل '+bad+': '+EM(fe):''))}
function nv(i){[...$('nv').children].forEach((b,j)=>b.classList.toggle('on',i==j))}
function add(){nv(1);H('إضافة صور');V.innerHTML='<input type=file id=fi multiple accept="image/*"><button id=gb onclick="go()">ابدأ</button><progress id=pr value=0></progress><p id=st></p><p style="color:var(--mu)">اختار ٣٠–٥٠ صورة في المرة، دوس ابدأ <b>مرة واحدة بس</b>، وسيب الشاشة مفتوحة لحد ما تخلص.</p>'}
async function go(){if(busy)return;const f=[...$('fi').files];if(!f.length)return alert('اختار صور الأول');busy=true;$('gb').disabled=true;$('st').textContent='جاري التحضير...';
try{await addFiles(f)}catch(e){alert('حصل خطأ: '+EM(e))}
if($('fi'))$('fi').value='';busy=false;if($('gb'))$('gb').disabled=false}
function grid(l,s){return '<div class=grid>'+l.map(p=>`<div id="t${p.id}" class="${S.has(p.id)?'s':''}" onclick="${s?`tg(${p.id})`:`view(${p.id})`}"><img src="${p.thumb}"></div>`).join('')+'</div>'}
function tg(id){S.has(id)?S.delete(id):S.add(id);$('t'+id).classList.toggle('s')}
async function view(id){const bl=await blobOf(id),u=URL.createObjectURL(bl),d=document.createElement('div');d.style='position:fixed;inset:0;background:#000;z-index:9;display:flex;align-items:center;justify-content:center';d.innerHTML=`<img src="${u}" style="max-width:100%;max-height:100%">`;d.onclick=()=>{d.remove();URL.revokeObjectURL(u)};document.body.append(d)}
async function home(){nv(0);H('الفولدرات');cur=null;const A=await all('p'),P=await all('u'),cats=JSON.parse(localStorage.cats||'[]');const n=k=>A.filter(p=>p.folder==k).length;
const rows=[['invoice','🧾','الفواتير','#f59e0b'],['private','🔒','خاص','#ef4444'],...P.filter(u=>!u.priv).map(u=>['person:'+u.id,'👤',u.name,'#3b82f6',1]),...cats.map(c=>['prod:'+c,'📦',c,'#10b981',1]),['unsorted','🖼','غير مقسمة','#64748b'],['review','❓','وجوه غير معروفة','#8b5cf6']];
V.innerHTML='<div class=bar><button onclick="nc()">+ قسم منتجات</button><button onclick="ppl()">+ شخص جديد</button><button class=g onclick="ed=!ed;home()">'+(ed?'تم ✔':'✏️ تعديل')+'</button></div>'+rows.map(r=>`<div class=f data-k="${r[0]}" data-t="${r[1]} ${r[2]}" onclick="fold(this.dataset.k,this.dataset.t)"><span class=ic style="background:${r[3]}22">${r[1]}</span><span class=nm>${r[2]}</span>${ed&&r[4]?`<button class=dl onclick="event.stopPropagation();rm(this.parentNode.dataset.k)">🗑</button>`:`<b>${n(r[0])}</b>`}</div>`).join('')}
async function rm(k){if(!confirm('تمسح الفولدر ده؟ الصور نفسها مش هتتمسح، هترجع لـ "غير مقسمة" أو "وجوه غير معروفة".'))return;
if(k.startsWith('prod:')){const c=JSON.parse(localStorage.cats||'[]').filter(x=>'prod:'+x!=k);localStorage.cats=JSON.stringify(c);for(const p of await all('p'))if(p.folder==k){p.folder='unsorted';await put('p',p)}}
else if(k.startsWith('person:')){const id=+k.slice(7);await tx('u','readwrite',o=>o.delete(id));for(const p of await all('p'))if(p.folder==k){p.folder='review';await put('p',p)}}
home()}
function nc(){const n=(prompt('اسم القسم')||'').replace(/["'<>]/g,'').trim();if(!n)return;const c=JSON.parse(localStorage.cats||'[]');c.push(n);localStorage.cats=JSON.stringify(c);home()}
async function sha(s){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function unlock(){const h=localStorage.pw;if(!h){const a=prompt('اعمل كلمة سر للفولدر الخاص');if(!a)return false;localStorage.pw=await sha(a);return true}const a=prompt('كلمة السر');return !!a&&await sha(a)==h}
async function fold(k,t){if(k=='private'&&!await unlock())return;cur=k;cur_t=t;S.clear();sel=false;draw()}
async function draw(){const A=(await all('p')).filter(p=>p.folder==cur),P=await all('u'),cats=JSON.parse(localStorage.cats||'[]');H(cur_t+' ('+A.length+')');
const opts=[['invoice','الفواتير'],['private','خاص'],...P.filter(u=>!u.priv).map(u=>['person:'+u.id,'👤 '+u.name]),...cats.map(c=>['prod:'+c,c]),['unsorted','غير مقسمة'],['review','وجوه غير معروفة']].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');
V.innerHTML=`<button class=g onclick="home()">→ رجوع</button><button class=g onclick="sel=!sel;S.clear();draw()">${sel?'إلغاء التحديد':'تحديد'}</button>`+(sel?`<button class=g onclick="selAll()">تحديد الكل</button><button onclick="mkp()">👤 تعريف كشخص</button><select id=dst>${opts}</select><button onclick="mv()">نقل المحدد</button><button class=g onclick="del()">حذف المحدد</button>`:'')+grid(A,sel)}
async function selAll(){(await all('p')).filter(p=>p.folder==cur).forEach(p=>S.add(p.id));draw()}
async function mkp(){if(!S.size)return alert('حدد صور الأول');const n=(prompt('اسم الشخص')||'').replace(/["'<>]/g,'').trim();if(!n)return;const priv=confirm('الشخص ده خاص؟ (موافق = خاص ، إلغاء = عادي)');const d=[],c=[],ps=[];
for(const id of S){const p=await get('p',id);if(p.faces.length==1){d.push(p.faces[0]);c.push(p.cl&&p.cl[0]||null);ps.push(p)}}
if(!d.length)return alert('مفيش في المحدد صورة فيها وش واحد بس');
const uid=await put('u',{name:n,desc:d,cl:c,priv});for(const p of ps){p.folder=priv?'private':'person:'+uid;await put('p',p)}
S.clear();await classify();alert('تم! اتعرف الشخص من '+ps.length+' صورة');home()}
async function mv(){const d=$('dst').value,P=await all('u');for(const id of S){const p=await get('p',id);
if(p.folder.startsWith('person:')&&p.folder!=d){const u=P.find(x=>'person:'+x.id==p.folder);if(u){rmFace(u,p.faces);await put('u',u)}}
if(d.startsWith('person:')){const u=P.find(x=>'person:'+x.id==d);if(u&&p.faces.length==1){addFace(u,p.faces[0],p.cl&&p.cl[0]);await put('u',u)}}
p.folder=d;delete p.auto;await put('p',p)}S.clear();draw()}
async function del(){if(!confirm('تحذف الصور المحددة؟'))return;for(const id of S)await delp(id);S.clear();draw()}
async function ppl(){nv(2);H('الأشخاص');S.clear();const P=await all('u'),A=(await all('p')).filter(p=>p.faces.length==1&&p.folder=='review');
V.innerHTML=P.map(u=>`<div class=f><span class=nm>${u.name}${u.priv?' 🔒':''}</span><button class=g onclick="dp(${u.id})">حذف</button></div>`).join('')+'<h3>شخص جديد: اختار صور وشه فيها لوحده</h3>'+grid(A,true)+'<input id=pn placeholder="اسم الشخص"><label><input type=checkbox id=pv style="width:auto"> صوره خاصة (تروح الفولدر المقفول)</label><br><button onclick="sp()">حفظ الشخص</button>'}
async function sp(){const n=$('pn').value.trim();if(!n||!S.size)return alert('اكتب الاسم واختار صور');const d=[],c=[];for(const id of S){const p=await get('p',id);d.push(p.faces[0]);c.push(p.cl&&p.cl[0]||null)}await put('u',{name:n,desc:d,cl:c,priv:$('pv').checked});await classify();S.clear();ppl()}
async function dp(id){if(!confirm('تحذف الشخص؟'))return;await tx('u','readwrite',o=>o.delete(id));for(const p of await all('p'))if(p.folder=='person:'+id){p.folder='review';await put('p',p)}ppl()}
function sort(){nv(3);H('تصنيف');V.innerHTML='<button onclick="auto()">🧠 تصنيف المنتجات والفواتير تلقائي</button><button class=g onclick="undoAuto()">↩️ تراجع عن التصنيف التلقائي</button><button onclick="smart()">✨ تحسين ذكي (يقرأ اللبس)</button><button onclick="redo()">🔄 إعادة توزيع صور الأشخاص</button><button onclick="rescan()">🔍 إعادة قراءة الوجوه (أدق)</button><button onclick="classify().then(()=>alert(\'تم\'))">إعادة مطابقة الوجوه</button><button onclick="inv()">🧾 فرز الفواتير (بطيء)</button><button class=g onclick="dd()">حذف الصور المكررة</button><progress id=pr value=0></progress><p id=st></p>'}
async function rescan(){if(busy)return;busy=true;try{pg(0,1,'بحمل برنامج الوجوه...');await models();const A=(await all('p')).filter(p=>['new','review','unsorted'].includes(p.folder));
for(let i=0;i<A.length;i++){const p=A[i];try{const r=await faces(await blobOf(p.id));p.faces=r.faces;p.cl=r.cl;p.folder='new';await put('p',p)}catch(e){}pg(i+1,A.length,(i+1)+' / '+A.length)}
await classify();pg(A.length,A.length,'خلصنا ✅')}catch(e){alert('حصل خطأ: '+EM(e))}busy=false}
async function dd(){const A=await all('p'),s=new Set();let n=0;for(const p of A){if(s.has(p.thumb)){await delp(p.id);n++}else s.add(p.thumb)}alert('اتحذف '+n+' صورة مكررة')}
async function inv(){const A=(await all('p')).filter(p=>p.folder=='unsorted');pg(0,A.length,'بحمل قراءة الكتابة...');const w=await Tesseract.createWorker('ara+eng');let k=0;
for(let i=0;i<A.length;i++){const p=A[i];try{const t=(await w.recognize(await cv(await blobOf(p.id),1400))).data.text;p.text=t;if((t.match(/فاتور|اجمالي|إجمالي|المجموع|الضريب|invoice|total|receipt/gi)||[]).length>=2){p.folder='invoice';k++}await put('p',p)}catch(e){}
pg(i+1,A.length,(i+1)+' / '+A.length+' — فواتير: '+k)}await w.terminate()}
open_().then(async()=>{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();await mig();return home()}).catch(e=>{showErr('مشكلة: '+EM(e))});
</script></body></html>
