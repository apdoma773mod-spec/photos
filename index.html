<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صوري</title>
<style>
body{margin:0;font-family:-apple-system,Tahoma,sans-serif;background:#0f1115;color:#eee;padding-bottom:70px}
header{padding:14px;font-size:20px;font-weight:700;background:#171a21;position:sticky;top:0;z-index:5}
.c{padding:12px}
button{background:#2f6fed;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;margin:4px}
button.g{background:#2a2f3a}
.f{background:#171a21;border-radius:12px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid div{aspect-ratio:1}
.grid img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.grid .s{outline:4px solid #2f6fed}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#171a21}
nav button{flex:1;background:none;border-radius:0;margin:0;padding:16px 0;font-size:14px}
input,select{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:10px;border:0;margin:4px 0}
progress{width:100%}
</style></head><body>
<header id="h">صوري</header><div class="c" id="v"></div>
<nav><button onclick="home()">📁 الفولدرات</button><button onclick="add()">➕ إضافة</button><button onclick="ppl()">👤 أشخاص</button><button onclick="sort()">⚙️ تصنيف</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id),V=$('v'),H=t=>$('h').textContent=t;
let db,cur,sel=false,S=new Set();
const open_=()=>new Promise(r=>{const q=indexedDB.open('photos1',1);q.onupgradeneeded=()=>{q.result.createObjectStore('p',{keyPath:'id',autoIncrement:true});q.result.createObjectStore('u',{keyPath:'id',autoIncrement:true})};q.onsuccess=()=>{db=q.result;r()}});
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,x)=>tx(s,'readwrite',o=>o.put(x)),get=(s,k)=>tx(s,'readonly',o=>o.get(k));
async function cv(blob,max){const b=await createImageBitmap(blob);const k=Math.min(1,max/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);b.close&&b.close();return c}
const pg=(i,n,t)=>{if($('pr')){$('pr').max=n;$('pr').value=i}if($('st'))$('st').textContent=t};
let ml;const M='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
function models(){if(!ml)ml=Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(M),faceapi.nets.faceLandmark68Net.loadFromUri(M),faceapi.nets.faceRecognitionNet.loadFromUri(M)]);return ml}
const dist=(a,b)=>{let s=0;for(let i=0;i<128;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)};
async function classify(){const P=await all('u'),A=await all('p');for(const p of A){if(p.folder!='new'&&p.folder!='review')continue;let f;
if(p.faces.length){const m=P.filter(u=>p.faces.some(d=>u.desc.some(e=>dist(d,e)<.5)));f=m.length?(m.some(u=>u.priv)?'private':'person:'+m[0].id):'review'}else f='unsorted';
if(f!=p.folder){p.folder=f;await put('p',p)}}}
async function addFiles(fs){pg(0,fs.length,'بحمل برنامج الوجوه...');await models();
for(let i=0;i<fs.length;i++){const f=fs[i];try{const c=await cv(f,900);const d=await faceapi.detectAllFaces(c,new faceapi.TinyFaceDetectorOptions({inputSize:512})).withFaceLandmarks().withFaceDescriptors();
const t=(await cv(f,240)).toDataURL('image/jpeg',.7);await put('p',{name:f.name,blob:f,thumb:t,faces:d.map(x=>Array.from(x.descriptor)),folder:'new',text:''})}catch(e){}
pg(i+1,fs.length,(i+1)+' / '+fs.length)}
await classify();pg(fs.length,fs.length,'خلصنا ✅')}
function add(){H('إضافة صور');V.innerHTML='<input type=file id=fi multiple accept="image/*"><button onclick="go()">ابدأ</button><progress id=pr value=0></progress><p id=st></p><p>ابعت دفعات ٢٠٠–٥٠٠ صورة، وسيب الشاشة مفتوحة لحد ما تخلص.</p>'}
function go(){const f=[...$('fi').files];if(f.length)addFiles(f)}
function grid(l,s){return '<div class=grid>'+l.map(p=>`<div id="t${p.id}" class="${S.has(p.id)?'s':''}" onclick="${s?`tg(${p.id})`:`view(${p.id})`}"><img src="${p.thumb}"></div>`).join('')+'</div>'}
function tg(id){S.has(id)?S.delete(id):S.add(id);$('t'+id).classList.toggle('s')}
async function view(id){const p=await get('p',id),u=URL.createObjectURL(p.blob),d=document.createElement('div');d.style='position:fixed;inset:0;background:#000;z-index:9;display:flex;align-items:center;justify-content:center';d.innerHTML=`<img src="${u}" style="max-width:100%;max-height:100%">`;d.onclick=()=>{d.remove();URL.revokeObjectURL(u)};document.body.append(d)}
async function home(){H('الفولدرات');cur=null;const A=await all('p'),P=await all('u'),cats=JSON.parse(localStorage.cats||'[]');const n=k=>A.filter(p=>p.folder==k).length;
const rows=[['invoice','🧾 الفواتير'],['private','🔒 خاص'],...P.filter(u=>!u.priv).map(u=>['person:'+u.id,'👤 '+u.name]),...cats.map(c=>['prod:'+c,'📦 '+c]),['unsorted','🖼 غير مقسمة'],['review','❓ وجوه غير معروفة']];
V.innerHTML=rows.map(r=>`<div class=f data-k="${r[0]}" data-t="${r[1]}" onclick="fold(this.dataset.k,this.dataset.t)"><span>${r[1]}</span><b>${n(r[0])}</b></div>`).join('')+'<button class=g onclick="nc()">+ قسم منتجات جديد</button>'}
function nc(){const n=(prompt('اسم القسم')||'').replace(/["'<>]/g,'').trim();if(!n)return;const c=JSON.parse(localStorage.cats||'[]');c.push(n);localStorage.cats=JSON.stringify(c);home()}
async function sha(s){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function unlock(){const h=localStorage.pw;if(!h){const a=prompt('اعمل كلمة سر للفولدر الخاص');if(!a)return false;localStorage.pw=await sha(a);return true}const a=prompt('كلمة السر');return !!a&&await sha(a)==h}
async function fold(k,t){if(k=='private'&&!await unlock())return;cur=k;cur_t=t;S.clear();sel=false;draw()}
let cur_t='';
async function draw(){const A=(await all('p')).filter(p=>p.folder==cur),cats=JSON.parse(localStorage.cats||'[]');H(cur_t+' ('+A.length+')');
const opts=[['invoice','الفواتير'],['private','خاص'],...cats.map(c=>['prod:'+c,c]),['unsorted','غير مقسمة']].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');
V.innerHTML=`<button class=g onclick="home()">→ رجوع</button><button class=g onclick="sel=!sel;S.clear();draw()">${sel?'إلغاء التحديد':'تحديد'}</button>`+(sel?`<select id=dst>${opts}</select><button onclick="mv()">نقل المحدد</button><button class=g onclick="del()">حذف المحدد</button>`:'')+grid(A,sel)}
async function mv(){const d=$('dst').value;for(const id of S){const p=await get('p',id);p.folder=d;await put('p',p)}S.clear();draw()}
async function del(){if(!confirm('تحذف الصور المحددة؟'))return;for(const id of S)await tx('p','readwrite',o=>o.delete(id));S.clear();draw()}
async function ppl(){H('الأشخاص');S.clear();const P=await all('u'),A=(await all('p')).filter(p=>p.faces.length==1&&p.folder=='review');
V.innerHTML=P.map(u=>`<div class=f><span>${u.name}${u.priv?' 🔒':''}</span><button class=g onclick="dp(${u.id})">حذف</button></div>`).join('')+'<h3>شخص جديد: اختار صور وشه فيها لوحده</h3>'+grid(A,true)+'<input id=pn placeholder="اسم الشخص"><label><input type=checkbox id=pv style="width:auto"> صوره خاصة (تروح الفولدر المقفول)</label><br><button onclick="sp()">حفظ الشخص</button>'}
async function sp(){const n=$('pn').value.trim();if(!n||!S.size)return alert('اكتب الاسم واختار صور');const d=[];for(const id of S)d.push((await get('p',id)).faces[0]);await put('u',{name:n,desc:d,priv:$('pv').checked});await classify();S.clear();ppl()}
async function dp(id){if(!confirm('تحذف الشخص؟'))return;await tx('u','readwrite',o=>o.delete(id));for(const p of await all('p'))if(p.folder=='person:'+id){p.folder='review';await put('p',p)}ppl()}
function sort(){H('تصنيف');V.innerHTML='<button onclick="classify().then(()=>alert(\'تم\'))">إعادة مطابقة الوجوه</button><button onclick="inv()">فرز الفواتير (بطيء)</button><progress id=pr value=0></progress><p id=st></p>'}
async function inv(){const A=(await all('p')).filter(p=>p.folder=='unsorted');pg(0,A.length,'بحمل قراءة الكتابة...');const w=await Tesseract.createWorker('ara+eng');let k=0;
for(let i=0;i<A.length;i++){const p=A[i];try{const t=(await w.recognize(await cv(p.blob,1400))).data.text;p.text=t;if((t.match(/فاتور|اجمالي|إجمالي|المجموع|الضريب|invoice|total|receipt/gi)||[]).length>=2){p.folder='invoice';k++}await put('p',p)}catch(e){}
pg(i+1,A.length,(i+1)+' / '+A.length+' — فواتير: '+k)}await w.terminate()}
open_().then(()=>{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();home()});
</script></body></html>
